<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketEscape</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      /* デザイントークン（色・角丸・モーション）は ../styles/tokens.css に集約。 */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { background: var(--te-bg); }

      body {
        width: 360px;
        color: var(--te-text);
        font-family: var(--te-font);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .ico    { width: 16px; height: 16px; display: inline-block; flex-shrink: 0; }
      .ico-sm { width: 13px; height: 13px; }
      .ico-lg { width: 30px; height: 30px; }

      /* ── Header ── */
      .te-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-bottom: 1px solid var(--te-line);
      }
      .brand { display: flex; align-items: center; gap: 9px; }
      .brand-mark { display: flex; color: var(--te-text); }
      .brand-name {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      /* ── Status chip ── */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: var(--te-r-pill);
        border: 1px solid transparent;
        font-family: var(--te-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .chip-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      .chip.idle    { color: var(--te-text-mut); background: var(--te-surface-2); border-color: var(--te-line); }
      .chip.armed   { color: var(--te-signal);    background: var(--te-signal-tint); border-color: var(--te-signal-line); }
      .chip.tminus,
      .chip.firing  { color: var(--te-signal-up); background: var(--te-signal-tint); border-color: var(--te-signal-line); }
      .chip.success { color: var(--te-ok);  background: var(--te-ok-tint); }
      .chip.failed  { color: var(--te-err); background: var(--te-err-tint); }
      .chip.armed  .chip-dot { animation: te-pulse 1.4s ease-in-out infinite; }
      .chip.tminus .chip-dot { animation: te-pulse 0.9s ease-in-out infinite; }
      .chip.firing .chip-dot { animation: te-pulse 0.6s ease-in-out infinite; }

      /* ── Hero (countdown / result) ── */
      .hero {
        padding: 18px 16px 16px;
        border-bottom: 1px solid var(--te-line);
      }
      .hero-eyebrow {
        font-family: var(--te-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--te-text-mut);
      }
      .hero-value {
        font-family: var(--te-mono);
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1.05;
        margin-top: 7px;
        color: var(--te-text-dim);
        font-variant-numeric: tabular-nums;
        transition: color var(--te-dur-base) var(--te-ease),
          transform var(--te-dur-base) var(--te-ease);
        transform-origin: left center;
      }
      .hero-value.armed   { color: var(--te-signal); }
      .hero-value.tminus,
      .hero-value.firing  { color: var(--te-signal-up); transform: scale(1.025); }
      .hero-value.success { color: var(--te-ok); }
      .hero-value.failed  { color: var(--te-err); }
      .hero-sub {
        margin-top: 7px;
        font-size: 12px;
        color: var(--te-text-mut);
      }
      .hero-result {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-top: 7px;
      }
      .hero-result .ico-lg { flex-shrink: 0; }
      .hero-result-title { font-size: 21px; font-weight: 700; line-height: 1.2; }
      .hero-result .hero-sub { margin-top: 3px; }

      /* ── Panel (job details) ── */
      .panel { padding: 15px 16px; }
      .hero-img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: var(--te-r-md);
        border: 1px solid var(--te-line);
        background: var(--te-surface-2);
        margin-bottom: 12px;
      }
      .eyebrow {
        font-family: var(--te-mono);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--te-text-mut);
      }
      .ev-title {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
        margin-top: 4px;
        color: var(--te-text);
        word-break: break-word;
      }
      .ev-title.empty {
        font-size: 13px;
        font-weight: 400;
        color: var(--te-text-mut);
      }
      .ev-url {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
        font-family: var(--te-mono);
        font-size: 11px;
        color: var(--te-text-mut);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .ev-url .ico-sm { color: var(--te-text-dim); }
      .ev-url span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .panel-div { height: 1px; background: var(--te-line); margin: 13px 0; }

      .meta { display: grid; gap: 11px; }
      .meta-row { display: flex; align-items: flex-start; gap: 10px; }
      .meta-ico {
        width: 28px; height: 28px;
        border-radius: var(--te-r-sm);
        background: var(--te-surface-2);
        border: 1px solid var(--te-line);
        color: var(--te-text-mut);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .meta-info { min-width: 0; }
      .meta-label {
        font-family: var(--te-mono);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--te-text-mut);
      }
      .meta-value {
        margin-top: 2px;
        font-size: 13px;
        font-weight: 500;
        color: var(--te-text-2);
        font-variant-numeric: tabular-nums;
      }
      .meta-value.mono { font-family: var(--te-mono); }

      .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
      .tchip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: var(--te-r-pill);
        background: var(--te-surface-2);
        border: 1px solid var(--te-line);
        color: var(--te-text-2);
        font-size: 11px;
        font-weight: 500;
      }
      .tchip .ico-sm { color: var(--te-text-mut); }
      .tchip .qty {
        font-family: var(--te-mono);
        font-weight: 600;
        color: var(--te-text);
      }

      /* ── Empty state ── */
      .empty { padding: 28px 20px; text-align: center; }
      .empty .ico-lg { color: var(--te-text-dim); }
      .empty-title {
        margin-top: 11px;
        font-size: 14px;
        font-weight: 700;
        color: var(--te-text-2);
      }
      .empty-body {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.65;
        color: var(--te-text-mut);
      }
      .empty-body .err { color: var(--te-err); }

      /* ── Edit form ── */
      .edit-form { display: grid; gap: 12px; }
      .field { display: grid; gap: 5px; }
      .field-label {
        font-family: var(--te-mono);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--te-text-mut);
      }
      .te-input {
        width: 100%;
        padding: 9px 10px;
        background: var(--te-surface-2);
        border: 1px solid var(--te-line);
        border-radius: var(--te-r-md);
        color: var(--te-text);
        font-family: var(--te-mono);
        font-size: 12px;
        outline: none;
      }
      .te-input:focus {
        border-color: var(--te-signal-line);
        box-shadow: 0 0 0 3px var(--te-signal-line);
      }
      input[type="datetime-local"].te-input { color-scheme: dark; }
      .read-btn,
      .mini-btn,
      .danger-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: var(--te-r-md);
        border: 1px solid var(--te-line-strong);
        background: transparent;
        color: var(--te-text-2);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .read-btn:hover,
      .mini-btn:hover { border-color: var(--te-signal-line); color: var(--te-signal); }
      .danger-btn {
        width: 100%;
        border-color: rgba(248, 81, 61, 0.5);
        color: var(--te-err);
      }
      .danger-btn:hover { border-color: var(--te-err); background: var(--te-err-tint); }
      .ticket-editor { display: grid; gap: 6px; }
      .ticket-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 7px 8px;
        border: 1px solid var(--te-line);
        border-radius: var(--te-r-md);
        background: var(--te-surface-2);
      }
      .ticket-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12.5px;
        font-weight: 600;
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--te-line-strong);
        border-radius: var(--te-r-sm);
        overflow: hidden;
        background: var(--te-bg);
      }
      .step-btn {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--te-text-2);
        cursor: pointer;
        font-size: 16px;
      }
      .step-val {
        width: 34px;
        height: 28px;
        border: none;
        border-left: 1px solid var(--te-line);
        border-right: 1px solid var(--te-line);
        background: transparent;
        color: var(--te-text);
        text-align: center;
        font-family: var(--te-mono);
        font-weight: 700;
        -moz-appearance: textfield;
      }
      .step-val::-webkit-outer-spin-button,
      .step-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .form-note {
        font-size: 11.5px;
        line-height: 1.55;
        color: var(--te-text-mut);
      }
      .form-note.warn { color: var(--te-signal); }

      /* ── Primary action ── */
      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: calc(100% - 32px);
        margin: 14px 16px 16px;
        padding: 11px 16px;
        background: var(--te-signal-fill);
        color: var(--te-on-signal);
        border: 1px solid var(--te-signal-fill);
        border-radius: var(--te-r-md);
        font-family: var(--te-font);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background var(--te-dur-fast) var(--te-ease),
          transform var(--te-dur-fast) var(--te-ease);
      }
      .btn-primary .ico { color: var(--te-on-signal); }
      .btn-primary:hover {
        background: var(--te-signal-up);
        border-color: var(--te-signal-up);
        transform: translateY(-1px);
      }
      .btn-primary:active { transform: translateY(0); }
      .btn-primary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--te-signal-line);
      }
      .btn-primary:disabled,
      .read-btn:disabled,
      .mini-btn:disabled,
      .danger-btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      @keyframes te-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.42; transform: scale(0.8); }
      }

      @media (prefers-reduced-motion: reduce) {
        .chip-dot { animation: none !important; }
        .hero-value { transition: none !important; transform: none !important; }
        .btn-primary { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="te-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3.4" />
            <circle cx="16" cy="16" r="3" stroke="currentColor" stroke-width="1.5" />
            <line x1="16" y1="1.5" x2="16" y2="7" style="stroke: var(--te-signal)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-name">TicketEscape</span>
      </div>
      <span id="statusChip" class="chip idle" role="status" aria-live="polite">
        <span class="chip-dot" aria-hidden="true"></span>
        <span id="statusChipLabel">IDLE</span>
      </span>
    </header>

    <section id="hero" class="hero" aria-label="カウントダウン">
      <div class="hero-eyebrow">カウントダウン</div>
      <div class="hero-value idle">--:--:--</div>
      <div class="hero-sub">実行待機していません</div>
    </section>

    <div id="mainCard" class="panel"></div>

    <button id="openOptionsButton" class="btn-primary" type="button">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M12 4.5V3M12 21v-1.5M4.5 12H3M21 12h-1.5M6.4 6.4 5.3 5.3M18.7 18.7l-1.1-1.1M17.6 6.4l1.1-1.1M5.3 18.7l1.1-1.1" />
      </svg>
      詳細コンソールで開く
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13M13 6l6 6-6 6" />
      </svg>
    </button>

    <script src="../lib/shared.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
